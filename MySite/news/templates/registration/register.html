{% extends 'base.html' %}
{% load news_tags %}

{% block title %}
    Регистрация :: {{block.super}}
{% endblock %}

{% block sidebar %}

{% endblock %}

{% block content %}
    <h1>Регистрация</h1>

        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary btn-block">
            Отправить
        </button>
    </form>
{% endblock %}
